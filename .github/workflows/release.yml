# Every push to main: if src/EclipseFix.r names a version with no release yet, build the patcher with
# tools/build.sh (Retro68 in Docker, pinned by digest), run the tests, tag the commit v<version> (v1.0 for
# Eclipse 68k Fix 1.0) and publish a GitHub Release with the .hqx, .bin and .dsk, the README, and their
# SHA-256 and MD5 sums (SHA256SUMS, MD5SUMS, and in the release notes). A push that keeps the version does
# nothing. Run it by hand on main to release a version whose push did not run it. The ParlorNet docs site
# fetches the files from the release at a pinned tag and checks their SHA-256.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, so two quick landings can't both release the same version
concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: version
        name: A new version?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/.*"\([0-9.]*\), MIT license".*/\1/p' src/EclipseFix.r | head -n 1)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "Eclipse 68k Fix $v is already released"
            echo "new=no" >> "$GITHUB_OUTPUT"
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.new == 'yes'
        run: tools/build.sh
      - name: Test
        if: steps.version.outputs.new == 'yes'
        run: python3 -m unittest discover -s tests
      - name: Release
        if: steps.version.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "Eclipse 68k Fix $VERSION, for Reversi The Eclipse 1.2 on 68k Macs with System 7 or later."
            echo "Built from this commit by tools/build.sh; the README has the instructions and the license."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat build/release/SHA256SUMS
            echo '```'
            echo
            echo "MD5:"
            echo
            echo '```'
            cat build/release/MD5SUMS
            echo '```'
          } > "$notes"
          gh release create "v$VERSION" build/release/* --target "$GITHUB_SHA" --title "Eclipse 68k Fix $VERSION" --notes-file "$notes"
